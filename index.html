<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000000;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .portal {
      width: 100%;
      max-width: 600px;
      text-align: left;
    }

    .icon {
      font-size: 40px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: clamp(28px, 5vw, 36px);
      font-weight: 600;
      letter-spacing: -0.5px;
      margin: 0 0 8px;
    }

    .subtitle {
      color: #888888;
      font-size: 15px;
      margin-bottom: 40px;
      line-height: 1.5;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      display: flex;
      align-items: center;
      padding: 20px 24px;
      border: 1px solid #222222;
      border-radius: 12px;
      background: #0a0a0a;
      color: white;
      text-decoration: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .card:hover {
      border-color: #555555;
      background: #141414;
    }

    .card-icon {
      font-size: 24px;
      margin-right: 18px;
    }

    .card-content h2 {
      font-size: 16px;
      font-weight: 500;
      margin: 0 0 4px;
    }

    .card-content p {
      color: #888888;
      font-size: 13px;
      margin: 0;
      line-height: 1.4;
    }

    footer {
      margin-top: 40px;
      color: #555555;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="portal">
    <div class="icon">🎓</div>
    <h1>KRISHNA MAHAJAN's code library</h1>
    <p class="subtitle">
      Welcome. Select a tool to get started.
    </p>

    <div class="cards">
      <a class="card" href="timetable.html">
        <div class="card-icon">📅</div>
        <div class="card-content">
          <h2>College Timetable</h2>
          <p>View your weekly class schedule and subjects.</p>
        </div>
      </a>

      <a class="card" href="mcq.html">
        <div class="card-icon">📝</div>
        <div class="card-content">
          <h2>MCQ Form</h2>
          <p>Practice multiple-choice questions and check answers.</p>
        </div>
      </a>
    </div>

    <footer>KRISHNA MAHAJAN</footer>
  </main>
</body>
</html>
